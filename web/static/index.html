<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inpaint Studio · bbox 实时对比</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">
    <i class="dot"></i>
    <b>Inpaint Studio</b>
    <span>bbox 实时对比</span>
  </div>
  <div class="actions">
    <button class="btn" id="btn-open">打开图片</button>
    <input type="file" id="file" accept="image/*" hidden>
    <select class="select" id="samples"><option value="">工作区示例…</option></select>
    <button class="btn ghost" id="btn-export" disabled>导出结果</button>
  </div>
</header>

<main>
  <aside class="panel">
    <div class="group">
      <div class="group-title">运行</div>
      <div class="seg" id="seg-live">
        <button data-v="1" class="on">实时</button>
        <button data-v="0">手动</button>
      </div>
      <button class="btn primary wide" id="btn-run" disabled>计算（Enter）</button>
    </div>

    <div class="group">
      <div class="group-title">对比方法</div>
      <div id="methods"></div>
    </div>

    <div class="group">
      <div class="group-title">mask / 合成</div>
      <label class="row"><span>外扩 dilate</span>
        <input type="range" id="dilate" min="0" max="30" value="6">
        <b id="v-dilate">6</b></label>
      <label class="row"><span>羽化 feather</span>
        <input type="range" id="feather" min="0" max="20" value="4">
        <b id="v-feather">4</b></label>
      <label class="row"><span>上下文 margin</span>
        <input type="range" id="margin" min="0.5" max="3" step="0.5" value="1">
        <b id="v-margin">1</b></label>
      <div class="row"><span>mask 形状</span>
        <select class="mini" id="mask-mode">
          <option value="rect">矩形（默认）</option>
          <option value="grabcut">GrabCut 分割</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="show-box" checked> 显示 bbox 框线（B）</label>
      <label class="check"><input type="checkbox" id="show-mask"> 在画面上显示 mask</label>
    </div>

    <div class="group tip">
      <div class="group-title">操作</div>
      <p><b>拖拽</b> 画框 · <b>框内拖动</b> 移动 · <b>拖角</b> 缩放</p>
      <p><b>空格</b> 按住看原图 · <b>Delete</b> 清除框</p>
      <p>点卡片切换主视图 · <b>双击卡片</b> 放大检查</p>
    </div>
  </aside>

  <section class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="stage-bar">
      <div class="seg" id="seg-view">
        <button data-v="0" class="on">单图</button>
        <button data-v="1">对比</button>
      </div>
    </div>
    <div class="placeholder" id="ph">
      <div class="ph-inner">
        <div class="ph-icon">⌗</div>
        <h2>把图片拖进来，或点右上角「打开图片」</h2>
        <p>然后在画面上拖出一个框，各算法会实时给出结果</p>
      </div>
    </div>
    <div class="status" id="status"></div>
  </section>
</main>

<section class="results" id="results"></section>

<div class="modal" id="modal" hidden>
  <div class="modal-bar">
    <b id="modal-title">放大检查</b>
    <span class="modal-hint">滚轮缩放 · 拖动平移 · 按住空格看原图</span>
    <div class="zoom-set">
      <button class="btn ghost sm" data-z="1">1×</button>
      <button class="btn ghost sm" data-z="2">2×</button>
      <button class="btn ghost sm" data-z="4">4×</button>
      <button class="btn ghost sm" data-z="8">8×</button>
    </div>
    <button class="btn ghost" id="modal-close">关闭</button>
  </div>
  <canvas id="modal-cv"></canvas>
</div>

<script src="/static/app.js"></script>
</body>
</html>
